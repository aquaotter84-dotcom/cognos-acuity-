name: Build COGNOS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action only answers 10 license prompts, but the current SDK
          # repository has more than that, which fails the step. Accept all
          # licenses ourselves in the next step instead.
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # A test failure stops the job before the APK is built.
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Assemble embedded Node project
        run: node mobile/make-nodejs-project.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Stamp versionCode/versionName from build run number
        # The in-app self-updater compares the installed Android versionCode
        # against the `versionCode:` stamp the publish workflow writes into
        # each release body. The build workflow's run_number is monotonic, so
        # it doubles as the versionCode. Fail loudly if the expected lines are
        # missing so a Capacitor template change can't silently unstamp builds.
        run: |
          G=android/app/build.gradle
          grep -qE '^\s*versionCode [0-9]+' "$G" || { echo "versionCode line not found in $G" >&2; exit 1; }
          grep -qE '^\s*versionName "' "$G" || { echo "versionName line not found in $G" >&2; exit 1; }
          sed -i -E "s/^(\s*)versionCode [0-9]+/\1versionCode ${{ github.run_number }}/" "$G"
          sed -i -E "s/^(\s*)versionName \"[^\"]*\"/\1versionName \"1.0.${{ github.run_number }}\"/" "$G"
          grep -nE '^\s*version(Code|Name) ' "$G"

      - name: Patch TTS plugin voice-data installer intent
        # The bundled TTS plugin's openInstall() fires ACTION_CHECK_TTS_DATA,
        # which Android 11+ package visibility silently drops without a
        # <queries> manifest entry — the "Install voice data" button becomes a
        # silent no-op. Patch the plugin source (android/ is regenerated fresh
        # each build, so this must live here, not in a committed file) to fire
        # the real installer action instead, and declare the <queries> entry
        # so the intent can resolve. Both sub-steps fail loudly if the expected
        # strings are missing, so a plugin update can't silently unfix this.
        run: |
          TTS_JAVA=node_modules/@capacitor-community/text-to-speech/android/src/main/java/com/getcapacitor/community/tts/TextToSpeech.java
          CHECK_COUNT=$(grep -c "ACTION_CHECK_TTS_DATA" "$TTS_JAVA")
          if [ "$CHECK_COUNT" != "1" ]; then
            echo "Expected exactly 1 ACTION_CHECK_TTS_DATA in $TTS_JAVA, found $CHECK_COUNT" >&2
            exit 1
          fi
          sed -i 's|installIntent.setAction(android.speech.tts.TextToSpeech.Engine.ACTION_CHECK_TTS_DATA);|installIntent.setAction(android.speech.tts.TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA);|' "$TTS_JAVA"
          grep -n "installIntent.setAction(android.speech.tts.TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA);" "$TTS_JAVA"
          M=android/app/src/main/AndroidManifest.xml
          # NOTE: the manifest needs the intent actions' literal string values,
          # NOT Java field names — XML has no constant resolution, and a wrong
          # action here silently keeps things broken under package visibility.
          # TTS_SERVICE is the critical one: without it, Android 11+ hides the
          # TTS service from our TextToSpeech client entirely (onInit ERROR,
          # zero voices, silent speak failures). INSTALL_TTS_DATA lets the
          # "Install voice data" button's intent resolve.
          TTS_SERVICE_ACTION="android.intent.action.TTS_SERVICE"
          TTS_INSTALL_ACTION="android.speech.tts.engine.INSTALL_TTS_DATA"
          if grep -q "<queries>" "$M"; then
            # A <queries> block already exists: add any missing intent inside it.
            for ACT in "$TTS_SERVICE_ACTION" "$TTS_INSTALL_ACTION"; do
              if ! grep -q "$ACT" "$M"; then
                sed -i "0,/<\/queries>/s//<intent><action android:name=\"$ACT\" \/><\/intent>\n    <\/queries>/" "$M"
              fi
            done
          else
            sed -i "0,/<application/s//<queries><intent><action android:name=\"$TTS_SERVICE_ACTION\" \/><\/intent><intent><action android:name=\"$TTS_INSTALL_ACTION\" \/><\/intent><\/queries>\n    <application/" "$M"
          fi
          grep -n "$TTS_SERVICE_ACTION" "$M"
          grep -n "$TTS_INSTALL_ACTION" "$M"

      - name: Permit loopback cleartext HTTP
        # The embedded server speaks plain HTTP on 127.0.0.1 only.
        # capacitor.config.ts sets server.cleartext; belt-and-braces here.
        # Idempotent: strip any existing value, then set "true".
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/ android:usesCleartextTraffic="[^"]*"//' "$M"
          sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' "$M"
          grep -n 'usesCleartextTraffic' "$M"

      - name: Enable self-update install path
        # The in-app updater (first-party cognos-updater plugin) downloads the
        # APK with DownloadManager and installs it via a FileProvider URI.
        # android/ is regenerated fresh each build, so all of this must live
        # here, not in a committed file. Idempotent: both inserts are
        # grep-guarded (the provider carries a marker comment).
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$M"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" \/>\n    <application/' "$M"
          fi
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$M" || { echo "REQUEST_INSTALL_PACKAGES missing after patch" >&2; exit 1; }
          if ! grep -q 'cognos-updater-fileprovider' "$M"; then
            sed -i '0,/<\/application>/s||<!-- cognos-updater-fileprovider -->\n    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/cognos_filepaths" /></provider>\n    </application>|' "$M"
          fi
          grep -q 'cognos-updater-fileprovider' "$M" || { echo "FileProvider declaration missing after patch" >&2; exit 1; }
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths>' '    <!-- APKs downloaded by the self-updater into the app Download dir -->' '    <external-files-path name="apk" path="Download/" />' '</paths>' > android/app/src/main/res/xml/cognos_filepaths.xml
          grep -q 'external-files-path' android/app/src/main/res/xml/cognos_filepaths.xml

      - name: Restore stable debug keystore
        # Every CI build MUST be signed with the SAME key or Android refuses
        # to install it over the previous one (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
        # The ephemeral runner would otherwise generate a fresh throwaway
        # debug keystore each run. Restore the stable one from the
        # COGNOS_DEBUG_KEYSTORE_B64 secret instead. It uses the conventional
        # debug alias/passwords, so assembleDebug picks it up with zero
        # build.gradle changes. Fails loudly if the secret is unset.
        env:
          COGNOS_DEBUG_KEYSTORE_B64: ${{ secrets.COGNOS_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$COGNOS_DEBUG_KEYSTORE_B64" ]; then
            echo "COGNOS_DEBUG_KEYSTORE_B64 secret is not set — builds would be signed with a throwaway key" >&2
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$COGNOS_DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null || { echo "Restored keystore is missing the androiddebugkey alias" >&2; exit 1; }
          echo "Stable debug keystore restored."

      - name: Pin debug signing to the stable keystore
        # AGP's implicit ~/.android/debug.keystore lookup proved unreliable:
        # a build generated a throwaway key and ignored the restored file,
        # which would have broken updates again. So pin the debug signing
        # config EXPLICITLY to the restored keystore. Fail loudly if the
        # expected buildTypes block is missing. Idempotent via marker.
        run: |
          G=android/app/build.gradle
          if ! grep -q 'STABLE_DEBUG_SIGNING' "$G"; then
            printf '%s\n' \
              "    // STABLE_DEBUG_SIGNING (injected by CI): pin debug signing to the" \
              "    // stable keystore restored from COGNOS_DEBUG_KEYSTORE_B64. Every" \
              "    // build must use the same key or Android rejects updates." \
              "    signingConfigs {" \
              "        debug {" \
              "            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')" \
              "            storePassword 'android'" \
              "            keyAlias 'androiddebugkey'" \
              "            keyPassword 'android'" \
              "        }" \
              "    }" > /tmp/stable-signing.gradle
            python3 -c "
          import re
          g = 'android/app/build.gradle'
          s = open(g).read()
          snippet = open('/tmp/stable-signing.gradle').read()
          s2, n = re.subn(r'(?m)^    buildTypes \{', lambda m: snippet + m.group(0), s, count=1)
          assert n == 1, 'buildTypes block not found in ' + g
          open(g, 'w').write(s2)
          print('pinned explicit debug signingConfig')
          "
          fi
          grep -q "storeFile file(System.getProperty('user.home')" "$G" || { echo "explicit signingConfig not pinned" >&2; exit 1; }
          grep -n 'STABLE_DEBUG_SIGNING' "$G" | head -2

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Confirm cleartext in merged manifest
        run: |
          M=$(find android/app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml | head -1)
          echo "merged manifest: ${M:-NOT FOUND}"
          if [ -z "$M" ]; then find android/app/build/intermediates -maxdepth 2 | head -20; exit 1; fi
          grep -n 'usesCleartextTraffic' "$M"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: cognos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
