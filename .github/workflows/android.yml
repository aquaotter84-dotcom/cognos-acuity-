name: Build COGNOS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action only answers 10 license prompts, but the current SDK
          # repository has more than that, which fails the step. Accept all
          # licenses ourselves in the next step instead.
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # A test failure stops the job before the APK is built.
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Assemble embedded Node project
        run: node mobile/make-nodejs-project.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Patch TTS plugin voice-data installer intent
        # The bundled TTS plugin's openInstall() fires ACTION_CHECK_TTS_DATA,
        # which Android 11+ package visibility silently drops without a
        # <queries> manifest entry — the "Install voice data" button becomes a
        # silent no-op. Patch the plugin source (android/ is regenerated fresh
        # each build, so this must live here, not in a committed file) to fire
        # the real installer action instead, and declare the <queries> entry
        # so the intent can resolve. Both sub-steps fail loudly if the expected
        # strings are missing, so a plugin update can't silently unfix this.
        run: |
          TTS_JAVA=node_modules/@capacitor-community/text-to-speech/android/src/main/java/com/getcapacitor/community/tts/TextToSpeech.java
          CHECK_COUNT=$(grep -c "ACTION_CHECK_TTS_DATA" "$TTS_JAVA")
          if [ "$CHECK_COUNT" != "1" ]; then
            echo "Expected exactly 1 ACTION_CHECK_TTS_DATA in $TTS_JAVA, found $CHECK_COUNT" >&2
            exit 1
          fi
          sed -i 's|installIntent.setAction(android.speech.tts.TextToSpeech.Engine.ACTION_CHECK_TTS_DATA);|installIntent.setAction(android.speech.tts.TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA);|' "$TTS_JAVA"
          grep -n "installIntent.setAction(android.speech.tts.TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA);" "$TTS_JAVA"
          M=android/app/src/main/AndroidManifest.xml
          # NOTE: the manifest needs the intent actions' literal string values,
          # NOT Java field names — XML has no constant resolution, and a wrong
          # action here silently keeps things broken under package visibility.
          # TTS_SERVICE is the critical one: without it, Android 11+ hides the
          # TTS service from our TextToSpeech client entirely (onInit ERROR,
          # zero voices, silent speak failures). INSTALL_TTS_DATA lets the
          # "Install voice data" button's intent resolve.
          TTS_SERVICE_ACTION="android.intent.action.TTS_SERVICE"
          TTS_INSTALL_ACTION="android.speech.tts.engine.INSTALL_TTS_DATA"
          if grep -q "<queries>" "$M"; then
            # A <queries> block already exists: add any missing intent inside it.
            for ACT in "$TTS_SERVICE_ACTION" "$TTS_INSTALL_ACTION"; do
              if ! grep -q "$ACT" "$M"; then
                sed -i "0,/<\/queries>/s//<intent><action android:name=\"$ACT\" \/><\/intent>\n    <\/queries>/" "$M"
              fi
            done
          else
            sed -i "0,/<application/s//<queries><intent><action android:name=\"$TTS_SERVICE_ACTION\" \/><\/intent><intent><action android:name=\"$TTS_INSTALL_ACTION\" \/><\/intent><\/queries>\n    <application/" "$M"
          fi
          grep -n "$TTS_SERVICE_ACTION" "$M"
          grep -n "$TTS_INSTALL_ACTION" "$M"

      - name: Permit loopback cleartext HTTP
        # The embedded server speaks plain HTTP on 127.0.0.1 only.
        # capacitor.config.ts sets server.cleartext; belt-and-braces here.
        # Idempotent: strip any existing value, then set "true".
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/ android:usesCleartextTraffic="[^"]*"//' "$M"
          sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' "$M"
          grep -n 'usesCleartextTraffic' "$M"

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Confirm cleartext in merged manifest
        run: |
          M=$(find android/app/build/intermediates -path '*merged*manifest*' -name AndroidManifest.xml | head -1)
          echo "merged manifest: ${M:-NOT FOUND}"
          if [ -z "$M" ]; then find android/app/build/intermediates -maxdepth 2 | head -20; exit 1; fi
          grep -n 'usesCleartextTraffic' "$M"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: cognos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
