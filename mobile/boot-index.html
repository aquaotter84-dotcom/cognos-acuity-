<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>COGNOS</title>
<style>
  html, body { margin:0; min-height:100%; background:#0b0e14; color:#e8eaf0;
    font-family: system-ui, sans-serif; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:16px; padding:24px;
    box-sizing:border-box; }
  .spin { width:42px; height:42px; border-radius:50%;
    border:3px solid #2a3040; border-top-color:#7aa2ff;
    animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #msg { font-size:14px; opacity:.75; max-width:72vw; text-align:center;
    white-space:pre-line; }
  #keyform { display:none; flex-direction:column; gap:12px; width:min(92vw, 380px); }
  #keyform h2 { font-size:18px; margin:0 0 4px; font-weight:600; }
  #keyform p { font-size:13px; opacity:.7; margin:0 0 4px; line-height:1.5; }
  #keyform input { background:#141926; border:1px solid #2a3040; color:#e8eaf0;
    border-radius:10px; padding:12px 14px; font-size:15px; width:100%;
    box-sizing:border-box; }
  #keyform input:focus { outline:none; border-color:#7aa2ff; }
  #keyform button { border:none; border-radius:10px; padding:13px; font-size:15px;
    font-weight:600; cursor:pointer; }
  #save { background:#7aa2ff; color:#0b0e14; }
  #skip { background:transparent; color:#8a93a8; font-weight:400; font-size:13px; }
</style>
</head>
<body>
<div class="spin" id="spin"></div>
<div id="msg">Starting COGNOS…</div>
<form id="keyform">
  <h2>Connect your AI model</h2>
  <p>COGNOS keeps its database on this phone, but AI answers still come from
     your model provider. Paste your BluesMinds (or OpenAI-compatible) API key —
     it's stored privately inside the app, never leaves your device except to
     call the model.</p>
  <input id="keyinput" type="password" placeholder="API key" autocomplete="off"
         autocapitalize="off" spellcheck="false" />
  <button id="save" type="submit">Save &amp; start COGNOS</button>
  <button id="skip" type="button">Continue without AI for now</button>
</form>
<script>
(async () => {
  const msgEl = document.getElementById('msg');
  const spinEl = document.getElementById('spin');
  const formEl = document.getElementById('keyform');
  const msg = (t) => { msgEl.textContent = t; };
  const PORT = 39391;
  const base = 'http://127.0.0.1:' + PORT;
  const KEY_PATH = 'cognos/bluesminds_api_key.txt';

  const Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
  const Filesystem = Plugins.Filesystem;

  async function keySaved() {
    try {
      await Filesystem.readFile({ directory: 'DATA', path: KEY_PATH });
      return true;
    } catch (e) { return false; }
  }

  async function saveKey(key) {
    try { await Filesystem.mkdir({ directory: 'DATA', path: 'cognos' }); }
    catch (e) { /* already exists */ }
    await Filesystem.writeFile({ directory: 'DATA', path: KEY_PATH, data: key });
  }

  function askForKey() {
    return new Promise((resolve) => {
      spinEl.style.display = 'none';
      msgEl.style.display = 'none';
      formEl.style.display = 'flex';
      const input = document.getElementById('keyinput');
      setTimeout(() => input.focus(), 300);
      formEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const key = input.value.trim();
        if (!key) return;
        try { await saveKey(key); } catch (err) { /* continue anyway */ }
        resolve();
      });
      document.getElementById('skip').addEventListener('click', () => resolve());
    }).finally(() => {
      formEl.style.display = 'none';
      spinEl.style.display = '';
      msgEl.style.display = '';
    });
  }

  async function boot() {
    try {
      const NodeJS = Plugins.CapacitorNodeJS || Plugins.NodeJS;
      if (!NodeJS || !NodeJS.start) throw new Error('NodeJS plugin unavailable');

      if (Filesystem && !(await keySaved())) {
        await askForKey();
      }

      // Internal-storage data dir: <app files>/cognos
      let filesDir = '/data/data/app.cognos.acuity/files';
      try {
        const r = await Filesystem.getUri({ directory: 'DATA', path: '' });
        filesDir = String(r.uri).replace(/^file:\/\//, '').replace(/\/$/, '');
      } catch (e) { /* keep the fallback above */ }
      const dataDir = filesDir + '/cognos';

      // NOTE: NodeJS.start() only resolves when the Node process EXITS — the
      // plugin settles the call after node::Start() returns. COGNOS is a
      // long-running server, so that promise never settles. Start the engine
      // fire-and-forget and use the HTTP health check below as the real
      // "server is ready" signal instead of awaiting start().
      msg('Starting local server…');
      let startError = null;
      const benign = (e) =>
        String((e && e.message) || e || '').includes('already been started');
      try {
        const p = NodeJS.start({
          script: 'entry.mjs',
          env: { COGNOS_DATA_DIR: dataDir, PORT: String(PORT) },
        });
        if (p && typeof p.catch === 'function') {
          // Surface genuine startup failures (e.g. project copy failed);
          // "already been started" just means the server survived an app
          // restart — the health check below will confirm it's up.
          p.catch((e) => { if (!benign(e)) startError = e; });
        }
      } catch (e) {
        if (!benign(e)) startError = e;
      }

      msg('Opening your database…');
      const bootT = Date.now();
      const deadline = bootT + 10 * 60 * 1000; // first launch unpacks the engine; can take minutes
      let lastNote = 0;
      let up = false;
      while (Date.now() < deadline) {
        if (startError) throw startError;
        try {
          await fetch(base + '/', { mode: 'no-cors', cache: 'no-store' });
          up = true;
          break; // TCP connect succeeded — the server is up
        } catch (e) { /* not listening yet */ }
        const elapsed = Math.floor((Date.now() - bootT) / 1000);
        if (elapsed - lastNote >= 20) {
          lastNote = elapsed;
          msg('Still starting… ' + elapsed + 's elapsed.\nFirst launch unpacks the engine — please keep the app open.');
        }
        await new Promise(r => setTimeout(r, 1000));
      }
      if (startError) throw startError;
      if (!up) {
        // Pull the on-device engine log so the failure is diagnosable.
        // Include the previous launch's log too: if the app was killed
        // during startup, the rotated log holds the evidence.
        async function tailOf(name) {
          try {
            const r = await Filesystem.readFile({ directory: 'DATA', path: 'cognos/' + name });
            const lines = String(r.data || '').split('\n');
            const tail = lines.slice(-25).join('\n');
            return tail || '(empty)';
          } catch (e) { return null; }
        }
        const logTail = await tailOf('boot.log');
        const prevTail = await tailOf('boot.prev.log');
        let logText = logTail == null ? '(no engine boot log found)' : logTail;
        if (prevTail) logText += '\n\n--- previous launch ---\n' + prevTail;
        spinEl.style.display = 'none';
        msg('Could not reach the local server after 10 minutes.\n\nEngine log:\n' + logText);
        return;
      }
      window.location.href = base + '/';
    } catch (e) {
      msg('Startup failed: ' + ((e && e.message) || e));
    }
  }

  boot();
})();
</script>
</body>
</html>
